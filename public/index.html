<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collage Maker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <a class="github-link" href="https://github.com/OtaYuk1/collage-maker" target="_blank" rel="noopener" aria-label="GitHubリポジトリを開く">
    <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
        -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
        .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
        -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
        1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
        1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
        1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
    </svg>
  </a>
  <h1>Collage Maker</h1>
</header>

<main>
  <section class="panel">
    <h2>1. 画像を選ぶ(最大<span id="max-count-label"></span>枚)</h2>
    <div id="dropzone" class="dropzone" tabindex="0">
      <p>ここに画像をドラッグ&ドロップ<br>またはクリックして選択</p>
      <input type="file" id="file-input" accept="image/*" multiple hidden>
    </div>
    <p id="image-count" class="count-label">0 / 15 枚</p>
    <p id="limit-message" class="limit-message" hidden></p>
    <ul id="thumb-list" class="thumb-list"></ul>
  </section>

  <section class="panel">
    <h2>2. レイアウト・トリミング</h2>
    <p class="section-lead">配置パターンを選ぶ</p>
    <div id="pattern-picker" class="pattern-picker" role="list" aria-label="レイアウトパターン"></div>
    <div id="canvas-wrap" class="canvas-wrap">
      <div id="collage" class="collage"></div>
    </div>
    <p class="hint">
      セル内の画像はドラッグで位置調整、ホイール/ピンチで拡大縮小できます。<br>
      長押ししてから動かすと、他のセルと入れ替えられます。
    </p>
  </section>

  <section class="panel">
    <h2>3. 装飾(任意)</h2>
    <div class="decoration-controls">
      <label>セル間の余白
        <input type="range" id="gap-range" min="0" max="40" value="0" step="1">
      </label>
      <label>背景色(余白部分の色にもなります)
        <span class="color-field">
          <input type="color" id="bg-color" value="#ffffff">
          <input type="text" id="bg-color-hex" class="color-hex-input" value="#ffffff"
                 inputmode="text" maxlength="7" spellcheck="false" aria-label="背景色のカラーコード"
                 pattern="#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})">
        </span>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="rounded-toggle">
        角丸にする
      </label>
    </div>
  </section>

  <section class="panel">
    <h2>4. 書き出し</h2>
    <div class="export-controls">
      <label>形式
        <select id="format-select">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
        </select>
      </label>
      <label id="quality-label" hidden>画質
        <input type="range" id="quality-range" min="0.1" max="1" step="0.05" value="0.92">
      </label>
      <button id="download-btn" type="button" disabled>ダウンロード</button>
    </div>
  </section>
</main>

<footer class="app-footer">
  <p>すべての処理はこのブラウザ上で完結します。画像や生成したコラージュがネットワークへ送信されることはありません。</p>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
